<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <!-- interactive-widget=resizes-content：鍵盤彈出時直接縮小畫面，不推動可視範圍。
       預設的推動方式在鍵盤收起後偶爾沒歸位，觸控位置跟畫面錯開，整個畫面點不動 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <!-- 手機上下的狀態列、導覽列固定純黑（Sam 決定，深淺色模式都一樣） -->
  <meta name="theme-color" content="#000000">
  <title>Thincery</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    html, body { margin: 0; height: 100%; background: #f5f5f4; overscroll-behavior-y: none; } /* 關掉 Chrome 的下拉重新整理；外殼本身不捲動，不影響裡面的捲動 */
    @media (prefers-color-scheme: dark) { html, body { background: #23262b; } }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    .fallback { position: fixed; left: 16px; right: 16px; bottom: 16px; display: none; padding: 12px 16px; border-radius: 12px;
      background: #1c1917; color: #fff; font: 15px/1.5 -apple-system, "Noto Sans TC", sans-serif; }
    .fallback a { color: #5eead4; }
  </style>
</head>
<body>
  <!-- 這個外殼只負責讓 Chrome 能安裝成網頁 App；實際的網頁和資料都在 Apps Script，只有登入本人能開 -->
  <iframe id="app" src="https://script.google.com/macros/s/AKfycbyDhROsmlwx6C7WJjds9wKkKTGc3uKWJSP46wgN4ZJTHDVtOQg_Z3zq__6veYdAkbczxw/exec" allow="camera; clipboard-write" title="Thincery"></iframe>
  <div class="fallback" id="fallback">
    畫面一直空白的話，可能是 Chrome 封鎖了第三方 Cookie。
    <a href="https://script.google.com/macros/s/AKfycbyDhROsmlwx6C7WJjds9wKkKTGc3uKWJSP46wgN4ZJTHDVtOQg_Z3zq__6veYdAkbczxw/exec" target="_blank" rel="noopener">改在新分頁開啟</a>
  </div>
  <script>
    // 20 秒還沒載入完成就顯示備用連結
    var loaded = false;
    document.getElementById('app').addEventListener('load', function () { loaded = true; });
    setTimeout(function () { if (!loaded) document.getElementById('fallback').style.display = 'block'; }, 20000);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
    // 外殼本身不捲動：可視範圍被推開（例如鍵盤收起後沒歸位）就拉回左上角，觸控位置才會跟畫面對齊
    if (window.visualViewport) {
      var realign = function () {
        if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
      };
      visualViewport.addEventListener('resize', function () { setTimeout(realign, 100); });
      visualViewport.addEventListener('scroll', function () { setTimeout(realign, 100); });
    }
  </script>
</body>
</html>
